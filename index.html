<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Genesys Telephony Toolkit</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#172033}.app{display:flex;min-height:100vh}.side{width:240px;background:#111827;color:#fff;padding:22px 14px;position:fixed;inset:0 auto 0 0}.logo{display:flex;gap:10px;align-items:center;margin:5px 8px 28px;font-weight:800}.g{background:#ff4f1f;width:38px;height:38px;border-radius:11px;display:grid;place-items:center}.nav{width:100%;border:0;background:transparent;color:#cbd5e1;text-align:left;padding:11px;border-radius:8px;margin:2px 0}.nav:hover,.nav.active{background:#ffffff12;color:#fff}.main{margin-left:240px;width:calc(100% - 240px)}.top{height:68px;background:white;border-bottom:1px solid #e5e9ef;padding:0 28px;display:flex;align-items:center;justify-content:space-between}.content{padding:28px}.hero{display:flex;justify-content:space-between;margin-bottom:22px}.hero h1{margin:0 0 7px;font-size:27px}.hero p{margin:0;color:#667085;font-size:13px}.btn{padding:9px 13px;border:1px solid #d8dee8;background:#fff;border-radius:8px;font-weight:700;font-size:12px;margin-left:7px}.primary{background:#ff4f1f;color:white;border-color:#ff4f1f}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:white;border:1px solid #e5e9ef;border-radius:12px}.card{padding:18px}.label{font-size:11px;color:#667085;font-weight:700}.num{font-size:28px;font-weight:800;margin-top:12px}.green{color:#0f9d72;font-size:11px;margin-top:5px}.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:16px}.head{padding:15px 17px;border-bottom:1px solid #e5e9ef;font-weight:800;font-size:13px}.body{padding:16px}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eef1f4;font-size:12px}.table{width:100%;border-collapse:collapse}.table th{background:#f8fafc;color:#667085;font-size:10px;text-align:left;padding:11px 14px}.table td{padding:12px 14px;border-top:1px solid #eef1f4;font-size:12px}.pill{padding:4px 8px;border-radius:99px;background:#e7f7f1;color:#087454;font-size:10px;font-weight:800}.warn{background:#fff5dc;color:#8a5a09}.toolbar{padding:13px 16px;border-bottom:1px solid #e5e9ef}.search{padding:9px;border:1px solid #d8dee8;border-radius:8px;width:300px}.hidden{display:none}
@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:650px){.side{width:68px}.side span{display:none}.main{margin-left:68px;width:calc(100% - 68px)}.content{padding:18px}.hero{display:block}.actions{margin-top:15px}.cards{grid-template-columns:1fr 1fr}}
</style></head>
<body>
<div class="app"><aside class="side"><div class="logo"><div class="g">G</div><span>Genesys Telephony<br><small>Administration Toolkit</small></span></div>
<button class="nav active" onclick="page('Dashboard',this)">▦ <span>Dashboard</span></button>
<button class="nav" onclick="page('Edges',this)">▣ <span>Edges</span></button>
<button class="nav" onclick="page('Trunks',this)">◈ <span>Trunks</span></button>
<button class="nav" onclick="page('Sites',this)">▤ <span>Sites</span></button>
<button class="nav" onclick="page('Edge Groups',this)">▦ <span>Edge Groups</span></button>
<button class="nav" onclick="page('Number Plans',this)">≡ <span>Number Plans</span></button>
<button class="nav" onclick="page('Outbound Routes',this)">⇄ <span>Outbound Routes</span></button>
<button class="nav" onclick="page('Compare',this)">⇔ <span>Compare</span></button>
<button class="nav" onclick="page('Backup',this)">▣ <span>Backup</span></button></aside>
<main class="main"><header class="top"><span>Telephony Toolkit / <b id="crumb">Dashboard</b></span><b>🟢 Connected · Demo</b></header><div class="content" id="content"></div></main></div>
<script>
const edges=[['Riyadh-Edge-01','Active','Riyadh','Production','3.0.0','10.10.1.11'],['Riyadh-Edge-02','Active','Riyadh','Production','3.0.0','10.10.1.12'],['Jeddah-Edge-01','Warning','Jeddah','DR','2.9.1','10.20.1.11'],['Dammam-Edge-01','Active','Dammam','Production','3.0.0','10.30.1.11']];
const trunks=[['Hospital-SIP-01','Active','sip01.provider.local','UDP',5060,100,'Off'],['Hospital-SIP-02','Active','sip02.provider.local','UDP',5060,100,'Off'],['Emergency-Trunk','Warning','emergency.provider.local','TCP',5061,50,'Enabled'],['DR-SIP-01','Inactive','dr.provider.local','UDP',5060,50,'Off']];
const pill=s=>'<span class="pill '+(s==='Warning'?'warn':'')+'">'+s+'</span>';
function page(p,el){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');document.getElementById('crumb').textContent=p;let c=document.getElementById('content');
if(p==='Dashboard')c.innerHTML='<div class="hero"><div><h1>Telephony Overview</h1><p>One workspace for Genesys Cloud Edges, Trunks, Sites and routing configuration.</p></div><div><button class="btn" onclick="page(\'Compare\')">⇔ Compare</button><button class="btn primary" onclick="page(\'Backup\')">▣ Backup</button></div></div><div class="cards"><div class="card"><div class="label">Edges</div><div class="num">4</div><div class="green">3 active · 1 warning</div></div><div class="card"><div class="label">External Trunks</div><div class="num">4</div><div class="green">2 active · 1 warning</div></div><div class="card"><div class="label">Sites</div><div class="num">3</div><div class="green">Configured</div></div><div class="card"><div class="label">Outbound Routes</div><div class="num">3</div><div class="green">Routing rules</div></div></div><div class="grid"><div class="panel"><div class="head">Configuration Health</div><div class="body"><div class="row">Edges '+pill('Warning')+'</div><div class="row">External Trunks '+pill('Warning')+'</div><div class="row">Sites '+pill('Healthy')+'</div><div class="row">Routing '+pill('Healthy')+'</div></div></div><div class="panel"><div class="head">Quick Actions</div><div class="body"><button class="btn" onclick="page(\'Edges\')">View Edges</button><button class="btn" onclick="page(\'Trunks\')">View Trunks</button><button class="btn" onclick="page(\'Compare\')">Compare</button></div></div></div>';
if(p==='Edges')c.innerHTML=header('Edges','Inventory, health and configuration of Genesys Cloud Edge devices.')+tab(['Name','Status','Site','Edge Group','Version','IP'],edges);
if(p==='Trunks')c.innerHTML=header('External Trunks','Review SIP configuration, capacity and security settings.')+tab(['Name','Status','Host','Transport','Port','Max Calls','TLS'],trunks);
if(p==='Sites')c.innerHTML=header('Sites','Telephony sites and attached resources.')+tab(['Name','Status','Edges','Trunks'],[['Riyadh','Healthy',2,2],['Jeddah','Warning',1,1],['Dammam','Healthy',1,1]]);
if(p==='Edge Groups')c.innerHTML=header('Edge Groups','Review Edge Group topology and health.')+tab(['Name','Site','Edges','Status'],[['Production','Riyadh / Dammam',3,'Healthy'],['DR','Jeddah',1,'Warning']]);
if(p==='Number Plans')c.innerHTML=header('Number Plans','Review dial patterns and classifications.')+tab(['Name','Pattern','Classification'],[['National','0XXXXXXXXX','National'],['Mobile','05XXXXXXXX','Mobile'],['International','00XXXXXXXXXXX','International']]);
if(p==='Outbound Routes')c.innerHTML=header('Outbound Routes','Review routing priorities and trunk assignments.')+tab(['Name','Priority','Classification','Trunk'],[['Local',1,'National','Hospital-SIP-01'],['Mobile',2,'Mobile','Hospital-SIP-01'],['International',3,'International','Hospital-SIP-02']]);
if(p==='Compare')c.innerHTML=header('Configuration Compare','Compare two trunks before changing production configuration.')+'<div class="panel"><div class="head">Hospital-SIP-01 vs Emergency-Trunk</div>'+tab2()+ '</div>';
if(p==='Backup')c.innerHTML=header('Backup & Restore','Create a portable snapshot of telephony configuration.')+'<div class="panel"><div class="body"><button class="btn primary" onclick="download()">▣ Create Backup</button><p class="green">Demo backup contains sample telephony configuration. Live Genesys API will be connected in the next phase.</p></div></div>';
}
function header(a,b){return '<div class="hero"><div><h1>'+a+'</h1><p>'+b+'</p></div></div>'}
function tab(h,r){return '<div class="panel"><div class="toolbar"><input class="search" placeholder="Search..." oninput="filter(this)"></div><div style="overflow:auto"><table class="table"><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+r.map(x=>'<tr>'+x.map((v,i)=>'<td>'+(i===1&&['Active','Warning','Inactive','Healthy'].includes(v)?pill(v):v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></div>'}
function tab2(){return tab(['Setting','Hospital-SIP-01','Emergency-Trunk','Result'],[['Protocol','SIP','SIP','Same'],['Host','sip01.provider.local','emergency.provider.local','Different'],['Port',5060,5061,'Different'],['Transport','UDP','TCP','Different'],['Max Calls',100,50,'Different'],['TLS','Off','Enabled','Different']])}
function filter(i){let q=i.value.toLowerCase();i.closest('.panel').querySelectorAll('tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
function download(){let data={generatedAt:new Date().toISOString(),edges,trunks};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='genesys-telephony-backup.json';a.click()}
page('Dashboard',document.querySelector('.nav'));
</script></body></html>
